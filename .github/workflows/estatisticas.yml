name: Estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # atualiza todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
